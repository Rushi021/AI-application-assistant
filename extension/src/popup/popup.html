<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Job Application Assistant</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Apply assistant</h1>
      <p class="step-label" id="stepLabel">Step 1 of 5 — Paste JD</p>
    </header>
    <div id="error" class="error" hidden></div>

    <section id="step-1" class="step">
      <label for="jd">Job description</label>
      <textarea id="jd" rows="10" placeholder="Paste the job description here. This is the first step."></textarea>
      <div class="grid">
        <label>Company <input id="company" /></label>
        <label>Role <input id="role" /></label>
        <label>Sponsorship <input id="sponsorship" /></label>
        <label>Date posted <input id="datePosted" /></label>
      </div>
      <label>Application link <input id="applyLink" /></label>
      <button id="ingestBtn">Score against my resumes</button>
    </section>

    <section id="step-2" class="step" hidden>
      <p>Pick a base resume. Highest score is recommended.</p>
      <div id="scores"></div>
      <button id="toTailor">Continue with selected resume</button>
    </section>

    <section id="step-3" class="step" hidden>
      <label class="check"><input type="checkbox" id="doTailor" checked /> Tailor with LLM</label>
      <label>Personalized instructions
        <textarea id="instructions" rows="4" placeholder="e.g. keep the metrics, emphasize RAG work"></textarea>
      </label>
      <button id="runTailor">Create tailor draft</button>
    </section>

    <section id="step-4" class="step" hidden>
      <div id="sections"></div>
      <button id="finalizeBtn">Finalize (write .tex / PDF)</button>
    </section>

    <section id="step-5" class="step" hidden>
      <p>Apply using autofill on this tab, then log the outcome.</p>
      <button id="autofillBtn">Autofill this page</button>
      <button id="applyBtn">Mark applied</button>
      <div class="row">
        <button id="okBtn" class="ok">Succeeded</button>
        <button id="failBtn" class="fail">Failed</button>
      </div>
      <pre id="finalPreview" class="preview"></pre>
    </section>

    <script src="../api.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
